<div class="auth-wrap page-enter">
  <div class="auth-card">
    <img src="assets/logo.png" alt="DSJ Portal" class="auth-logo">
    <h2>Logowanie</h2>
    <p class="auth-sub">zaloguj się na swoje konto</p>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <div class="form-group">
      <label>Login</label>
      <input type="text" [(ngModel)]="login" placeholder="Twój login" (keyup.enter)="submit()" />
    </div>
    <div class="form-group">
      <label>Hasło</label>
      <input type="password" [(ngModel)]="password" placeholder="Hasło" (keyup.enter)="submit()" />
    </div>

    <button class="btn btn-primary full-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Logowanie...' : 'Zaloguj się' }}
    </button>

    <p class="auth-link">
      Nie masz konta? <a routerLink="/rejestracja">Zarejestruj się</a>
    </p>
  </div>
</div>
